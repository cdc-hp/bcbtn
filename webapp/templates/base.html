<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17835f">
<title>{% block title %}Giám sát dịch bệnh{% endblock %} — CDC Hải Phòng</title>
<link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% block body %}
<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-brand">
      <div class="auth-brand-mark">CDC</div>
      <div>
        <div class="auth-brand-title">CDC Hải Phòng</div>
        <div class="auth-brand-subtitle">Ứng dụng Giám sát dịch bệnh</div>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
</div>
{% endblock %}
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/htmx.min.js"></script>
<script>
(function () {
  const compactKey = "cdc_sidebar_compact";

  function applySavedState() {
    try {
      if (localStorage.getItem(compactKey) === "1") {
        document.body.classList.add("sidebar-compact");
      }
    } catch (_) {}
  }

  function closeMobileSidebar() {
    document.body.classList.remove("sidebar-open");
  }

  applySavedState();

  document.addEventListener("click", function (event) {
    const collapseButton = event.target.closest("[data-sidebar-collapse]");
    if (collapseButton) {
      document.body.classList.toggle("sidebar-compact");
      try {
        localStorage.setItem(
          compactKey,
          document.body.classList.contains("sidebar-compact") ? "1" : "0"
        );
      } catch (_) {}
      return;
    }

    if (event.target.closest("[data-sidebar-open]")) {
      document.body.classList.add("sidebar-open");
      return;
    }

    if (event.target.closest("[data-sidebar-close]")) {
      closeMobileSidebar();
      return;
    }

    if (event.target.closest(".app-sidebar a")) {
      closeMobileSidebar();
    }
  });

  window.addEventListener("resize", function () {
    if (window.innerWidth >= 992) closeMobileSidebar();
  });
})();
</script>
</body>
</html>
